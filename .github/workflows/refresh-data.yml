name: Publish site and refresh official data
# Daily IMD and Maharain rainfall and district notices; GSDA groundwater on Mondays. Each
# importer checks its source before writing and leaves the previous files in place on any
# failure, so a bad day never blanks the site. This workflow explicitly deploys its
# validated snapshot to Pages. The CWC dam bulletin refuses requests from outside India, so
# it is refreshed from India by hand (see README) and pushed; a push redeploys.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 13 * * *'   # 19:00 IST, after IMD's afternoon district report
    - cron: '45 16 * * *'   # 22:15 IST backup: GitHub delays or drops some scheduled runs
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HUB_PUBLIC_DIR: ${{ github.workspace }}
      HUB_WORK_DIR: ${{ github.workspace }}/.work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pdftotext
        if: github.event_name != 'push'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: IMD district rainfall
        id: imd
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/import-rainfall.py
      - name: Maharain season rainfall by taluka and circle
        id: maharain
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/import-maharain.py
      - name: Decide which weekly feeds are due
        id: due
        if: github.event_name != 'push'
        run: |
          day=$(date -u +%u)
          manual=${{ github.event_name == 'workflow_dispatch' }}
          echo "groundwater=$( { [ "$day" = 1 ] || [ "$manual" = true ]; } && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: GSDA groundwater (Mondays, or when run by hand)
        id: groundwater
        if: github.event_name != 'push' && steps.due.outputs.groundwater == 'true'
        continue-on-error: true
        run: python tools/import-groundwater.py --download
      - name: District notices and public contacts
        id: services
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/import-district-services.py
      - name: Record refresh results
        if: github.event_name != 'push'
        env:
          FEED_RAINFALL: ${{ steps.imd.outcome }}
          FEED_SEASON: ${{ steps.maharain.outcome }}
          FEED_GROUNDWATER: ${{ steps.groundwater.outcome }}
          FEED_SERVICES: ${{ steps.services.outcome }}
        run: python tools/write-refresh-status.py
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changed."; exit 0; fi
          git commit -m "chore: refresh official data $(date -u +%Y-%m-%d)"
          git push
      - name: Prepare public files
        run: python tools/prepare-pages.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy this snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Flag failed imports
        if: steps.imd.outcome == 'failure' || steps.maharain.outcome == 'failure' || steps.groundwater.outcome == 'failure' || steps.services.outcome == 'failure'
        run: |
          echo "::warning::An import failed (IMD: ${{ steps.imd.outcome }}, Maharain: ${{ steps.maharain.outcome }}, groundwater: ${{ steps.groundwater.outcome }}, district notices: ${{ steps.services.outcome }}). The previous data was kept."
          exit 1
